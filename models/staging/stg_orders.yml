version: 2

models:
  - name: stg_orders
    description: "Cleaned and standardised order-level data. One row per order."

    columns:
      - name: order_id 
        description: "Unique identifier for each order."
        data_tests:
          - not_null
          - unique 
      
      - name: customer_id
        description: "Unique identifier for the customer who placed the order."

      - name: order_status
        description: "Current status of the order."

      - name: purchased_at
        description: "Timestamp when the order was purchased."

      - name: approved_at
        description: "Timestamp when the order was approved."

      - name: delivered_to_carrier_at
        description: "Timestamp when the order was handed to the carrier."

      - name: delivered_to_customer_at
        description: "Timestamp when the order was delivered to the customer."

      - name: estimated_delivery_at
        description: "Estimated delivery timestamp provided for the order."